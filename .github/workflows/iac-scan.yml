
name: Infrastructure Security Scan

on:
  workflow_call:
    outputs:
      scan-result:
        description: "IaC scan result"
        value: ${{ jobs.iac-scan.outputs.result }}

jobs:
  iac-scan:
    name: IAC Scan with Trivy
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.scan-result.outputs.result }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        id: scan-tool
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: infra/
          hide-progress: true
          format: 'sarif'
          limit-severities-for-sarif: true
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: infra/
          hide-progress: true
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload JSON report as artifact
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report
          path: trivy-results.json
          retention-days: 7

      - name: Normalize SARIF paths to repo root
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          jq '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= "infra/" + .' \
            trivy-results.sarif > trivy-iac.sarif

      - name: Summarize findings
        if: always() && hashFiles('trivy-iac.sarif') != ''
        run: |
          COUNT=$(jq '[.runs[].results[]] | length' trivy-iac.sarif)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "No security alerts"
          else
            echo "Found $COUNT Trivy IaC finding(s):"
            jq -r '.runs[].results[] |
              "  - \(.ruleId) | \(.message.text)\n      \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 1)"' \
              trivy-iac.sarif
          fi

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Set scan result
        id: scan-result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan-tool.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ "$SCAN_OUTCOME" == "success" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "IAC scan passed"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "IAC scan failed"
            if [ "$EVENT_NAME" == "pull_request" ]; then
              echo "View findings: https://github.com/${REPOSITORY}/security/code-scanning?query=pr%3A${PR_NUMBER}+is%3Aopen"
            else
              echo "View findings: https://github.com/${REPOSITORY}/security/code-scanning"
            fi
            exit 1
          fi
